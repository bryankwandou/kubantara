# Build dan uji Playwright di server GitHub, bukan di komputer sendiri.
# Uji yang mendaftarkan akun butuh secret DATABASE_URL dan AUTH_SECRET;
# tanpa itu, uji tersebut akan gagal dengan jelas di log.
name: uji

on:
  push:
    branches-ignore: [master, main]
  workflow_dispatch:

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build
      - name: Nyalakan server
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:3000
      - name: Jalankan semua uji
        run: |
          mkdir -p hasil
          for f in uji-*.mjs; do
            echo "===== $f ====="
            if timeout 900 node "$f" > "hasil/${f%.mjs}.log" 2>&1; then
              echo "LULUS $f" | tee -a hasil/ringkasan.txt
            else
              echo "GAGAL $f (exit $?)" | tee -a hasil/ringkasan.txt
            fi
            grep -E "GAGAL|lulus, .* gagal" "hasil/${f%.mjs}.log" || true
          done
          cat hasil/ringkasan.txt >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-uji
          path: |
            hasil/
            server.log
            _*.png
